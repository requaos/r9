# The q35 net gate profile (13-05, X64-04) — config_q35.toml with the
# D-01a bound step landed: the dev list below gains the ether key, which
# compiles cfg(dev_ether), so the virtio-net bind (pci.rs's bind half)
# runs inside main9's pre-sti window and the netdev stanza 13-01 staged
# idle now carries a driver.  The kernel-side ARP trigger (netgate.rs,
# cfg(dev_ether)) rides the same dev key after sti — kernel-side ONLY
# this phase (Pitfall 11: no userspace-launch machinery until Phase 14's
# XEXEC scope).
[build]
target = "lib/x86_64-unknown-none-elf.json"
buildflags = [
    "-Z", "build-std=core,alloc"
]

[link]
script = 'x86_64/lib/kernel.ld'
load-address = '0xffffffff80200000'

[config]
platform = "q35"
dev = ["ether"]

[qemu]
machine = "q35"
accel = "kvm"
cpu = "host"
smp = 1
memory = "1024M"

# The 07-01 D-10 netdev stanza, bound leg: the same slirp user net the
# aarch64 virtnet gate rides — the ARP ping-pong target is the gateway
# 10.0.2.2 (the slirp watch-out carried verbatim), and the filter-dump
# capture is the host-side pcap the finish()-time assertion reads.
[qemu.netdev]
mode = "user"
device = "virtio-net-pci-non-transitional"
pcap = true

[dist]
format = "elf"
