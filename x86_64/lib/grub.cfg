# x86_64/lib/grub.cfg — the D-02 boot chain's loader config (13-01).
# Staged by xtask's ISO build at <iso>/boot/grub/grub.cfg next to the
# kernel ELF at <iso>/boot/kernel.  Serial console first: GRUB's own
# errors ("no multiboot header found" and friends) land on the same
# wire the boot-test gate asserts the kernel banner on — a wedged
# channel is visible on the socket, never silent.
# @R9-MODULE-DOC@ module-line placeholder (14-05, D-03): this file is the
# @R9-MODULE-DOC@ TEMPLATE SOURCE — the ISO builders (xtask's build_x86_64_iso,
# @R9-MODULE-DOC@ the 14-07 flake iso-builder) emit the staged config from it.
# @R9-MODULE-DOC@ Every `# @R9-MODULE-DOC@` line is template documentation and is
# @R9-MODULE-DOC@ dropped by every emitter.  A `# @R9-MODULE@ ` line below is the
# @R9-MODULE-DOC@ module2 placeholder: emitted IN — uncommented, in place — when
# @R9-MODULE-DOC@ a boot module is staged (the composed/dev-exec ISOs), dropped
# @R9-MODULE-DOC@ OUT for kernel-only ISOs, whose staged config stays byte-
# @R9-MODULE-DOC@ identical to Phase 13's (GRUB fails a menuentry whose module
# @R9-MODULE-DOC@ file is absent, so kernel-only ISOs must not carry the line —
# @R9-MODULE-DOC@ the wired boot-iso FOD hash rides on those bytes).  module2 is
# @R9-MODULE-DOC@ the mb2 directive: the mb1 `module` mixing trap silently drops
# @R9-MODULE-DOC@ the module (14-RESEARCH Pitfall 3).  The staged module lands at
# @R9-MODULE-DOC@ /boot/bootfs.paq; the kernel finds it via mb2 tag 3.
serial --unit=0 --speed=115200
terminal_output serial
set timeout=0
menuentry "r9" {
    multiboot2 /boot/kernel
    # @R9-MODULE@ module2 /boot/bootfs.paq
    boot
}
