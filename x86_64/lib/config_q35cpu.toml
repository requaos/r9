# The q35cpu bootconf-tracer profile (19-01, CPU-02) — the append seam's
# gate: the boot-chain kernel (dev = ["exec", "bootchain"] — the chain
# WITHOUT ether/ip; the tracer's cpurc fixture needs no net, and the
# carried netdev stanza keeps the q35 DISCOVERY contract honest the
# q35auth way: the NIC present, unbound) boots the Harvey §15 cpu bake
# through the [dist] append seam.  The append line is the
# plan9.ini-equivalent bootconf the kernel parses from the mb2 tag-1
# cmdline string into the ROOT env seed: init=/amd64/init -c makes
# boot(8)'s execinit exec init -c (the getenv("init") arm — the
# multi-word value tokenized verbatim), whose cpustart runs
# rc -c /rc/bin/cpurc.  The §15 skeleton stages a flat marker fixture
# there (echo cpurc: RAN), so the q35cpu gate asserts the WHOLE
# architecture — append seam -> mb2 tag 1 -> bootconf pairs -> env seed
# (the devenv: bootconf line) -> execinit -> init -c -> cpurc — with
# the failure-loop symptom (init: starting /bin/rc) prohibited.  Since
# 19-03 the fixture is a REAL #! rc SCRIPT (the kernel #! pre-pass
# re-execs it) carrying the two ring-3 legs: the hash-bang exec
# round-trip (SHEBANG-OK — the #! token reaching the interpreter is
# the argv-order proof) and the REMOVE/sys_remove round-trip over the
# ported devcap arm (REMOVE-OK); the gate greps both directions
# (success markers present, FAIL markers absent).  The CONTROL leg is
# q35shell itself: no append key, the terminal path byte-untouched
# (one-image-per-gate; 19-07 expands the fixture into the real cpurc).
#
# Venue (the q35auth shape): KVM-native (the TCG leg rides R9_ACCEL=tcg
# R9_CPU=qemu64 — the 13-06 no-silent-downgrade chain), smp 1, 1 GiB.
# Parallel-boot constraint (carried): two simultaneous q35 boots bind
# the two loopback hostfwd ports (127.0.0.1:17010/5670) — run the
# x86_64 gates sequentially.
[build]
target = "lib/x86_64-unknown-none-elf.json"
buildflags = [
    "-Z", "build-std=core,alloc"
]

[link]
script = 'x86_64/lib/kernel.ld'
load-address = '0xffffffff80200000'

[config]
platform = "q35"
# 19-03 adds "cap": the §15 remove leg's #¤/caphash round-trip needs
# devcap in the kernel (the ported remove arm's named consumer —
# CPU-03's first live proof; the q35auth substrate precedent's key).
# 19-08 re-keys the set for 19-07's REAL §15 cpurc: the ladder's ether
# leg binds '#I'/'#l0' from userspace (ipconfig over the slirp NIC), so
# ether+ip join the set — without them cpurc's leg 2 fails `unknown #
# device' and the DONE verdict never arrives; the 19-03 fixture legs
# (SHEBANG-OK/REMOVE-OK) are retired with the fixture body (their proof
# is load-bearing at the tcp17010 service point on the composed gate).
dev = ["exec", "bootchain", "cap", "ether", "ip"]

[qemu]
machine = "q35"
accel = "kvm"
cpu = "host"
smp = 1
memory = "1024M"

# The netdev stanza is CARRIED (the q35auth shape) for the discovery
# contract above; pcap stays false (this gate never reads a capture).
[qemu.netdev]
default = "slirp"

[qemu.netdev.slirp]
mode = "user"
device = "virtio-net-pci-non-transitional"
hostfwd = [
    "tcp:127.0.0.1:17010-:17010",
    "tcp:127.0.0.1:5670-:567",
]
pcap = false

[qemu.netdev.tap]
mode = "tap"
device = "virtio-net-pci-non-transitional"
br = "br0"
helper = "/run/wrappers/bin/qemu-bridge-helper"
pcap = true

[qemu.netdev.vmnet]
mode = "vmnet-socket"
device = "virtio-net-pci-non-transitional"
socket-path = "/var/run/socket_vmnet"
pcap = false

[dist]
format = "elf"
# The staged bootfs: the §15 cpu image, now r9-assembled.  `image:cpu`
# names xtask/manifests/amd64/cpu.toml; the assembler runs the §15
# bake-time p9sk1 domain, stages the auth suite + cmd/cpu + aux/listen +
# the real cpurc + tcp17010 + the font payload, and bakes
# target/images/x86_64/cpu.paq on demand (its member list matches the
# reference bake's).  The ISO builder stages it at /boot/bootfs.paq and
# emits the grub.cfg module2 line IN.
module = "image:cpu"
# THE SEAM (CPU-02): the append the grub.cfg @R9-APPEND@ token
# substitutes on the multiboot2 line — GRUB delivers it as the mb2
# tag-1 string, the kernel parses it into the ROOT env seed's bootconf
# pairs, and boot(8)'s execinit consumes the multi-word init value
# verbatim.  This key is what makes the image a CPU image; its absence
# is the terminal image (the control leg).
append = "init=/amd64/init -c"
