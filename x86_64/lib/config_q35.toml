# The base q35 profile (13-01, D-01/D-02).  16-01 (D-05): the
# [qemu.netdev] stanza below is the mode-tables shape — default
# selector + per-mode sub-tables; the D-04 hostfwd remap (host 5670 ->
# guest 567) rides the slirp table as data.
[build]
target = "lib/x86_64-unknown-none-elf.json"
buildflags = [
    "-Z", "build-std=core,alloc"
]

[link]
script = 'x86_64/lib/kernel.ld'
load-address = '0xffffffff80200000'

[config]
# D-01: the q35 platform config — the x86_64 analog of aarch64's virt.
# The dev list is idle this plan (dev = []): the boot-test channel proof
# boots the parked old-gen payload to the banner only; dev_ether joins
# in 13-05 per D-01a's idle-unbound-then-bound staging order.
platform = "q35"
dev = []

[qemu]
# D-01: KVM-native gate default (-accel kvm -cpu host), q35 machine,
# -smp 1 (SMP stays a Future item), 1024M guest RAM.  TCG fallback runs
# per-invocation with --accel tcg --cpu qemu64 (X64-05 documents it).
machine = "q35"
accel = "kvm"
cpu = "host"
smp = 1
memory = "1024M"

# D-01a: the idle NIC staged as data (the 07-01 D-10 shape, x86 leg) —
# present on EVERY q35 invocation, unbound until 13-05's dev_ether
# (dev = [] above; an untouched virtio device never asserts an
# interrupt).  The filter-dump capture rides the same netdev, per-step
# pcap path (target/boot-test-q35.pcap / target/qemu-q35.pcap).
# 16-01 (D-05): the mode tables — the flat stanza is retired; ONE
# shared builder (xtask config::netdev_args) serves the in-process
# boots and the exported r9-netdev-args bin.  The slirp hostfwd set is
# D-04: loopback-bound host addresses only, host 5670 -> guest 567 (a
# literal host:567 bind needs privilege on default Linux —
# ip_unprivileged_port_start 1024 — and the hermetic default must
# stay zero-privilege/CI-able, HNET-01).
#
# Parallel-boot constraint: two simultaneous q35 boots on one host now
# both bind the two loopback hostfwd ports (127.0.0.1:17010 and
# 127.0.0.1:5670) at netdev init — run the x86_64 gates sequentially.
[qemu.netdev]
default = "slirp"

[qemu.netdev.slirp]
mode = "user"
device = "virtio-net-pci-non-transitional"
hostfwd = [
    "tcp:127.0.0.1:17010-:17010",
    "tcp:127.0.0.1:5670-:567",
]
pcap = true

[dist]
# The ELF64 is what GRUB loads (D-02: no objcopy, no -kernel); the ISO
# build (xtask, grub-mkrescue) stages this ELF directly.
format = "elf"
