cargo-features = ["per-package-target"]

[package]
name = "x86_64"
version = "0.1.0"
edition = "2024"
default-target = "x86_64-unknown-none"

[dependencies]
bitstruct = "0.1"
x86 = "0.52"
port = { path = "../port" }
seq-macro = "0.3.6"
zerocopy = { version = "0.8.27", features = ["derive"] }
bit_field = "0.10.3"
static_assertions = "1.1.0"

# check-cfg predeclare (the workspace Cargo.toml discipline, applied here
# because this crate is not lint-opted-in like riscv64): platform="q35"
# is emitted by config_q35.toml via xtask apply_platform_config;
# dev_ether joins in the same commit config_q35net.toml first emits it
# (dev = ["ether"] — the D-01a bound step), dev_ip for the future devip
# profile; dev_exec/dev_bootchain join at 14-04/14-05 (dev = ["exec"] /
# "bootchain" — the exec profiles' keys; predeclared together so the
# first emitting commit lands warning-free).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(platform, values("q35"))',
    'cfg(dev_ether)',
    'cfg(dev_ip)',
    'cfg(dev_exec)',
    'cfg(dev_bootchain)',
] }
