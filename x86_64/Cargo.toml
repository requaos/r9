cargo-features = ["per-package-target"]

[package]
name = "x86_64"
version = "0.1.0"
edition = "2024"
default-target = "x86_64-unknown-none"

[dependencies]
bitstruct = "0.1"
x86 = "0.52"
port = { path = "../port" }
seq-macro = "0.3.6"
zerocopy = { version = "0.8.27", features = ["derive"] }
bit_field = "0.10.3"
static_assertions = "1.1.0"

# Opt into the workspace lints (clippy undocumented_unsafe_blocks
# = deny + the workspace check-cfg declarations, which carry this
# crate's seven entries: platform="q35" from config_q35.toml via
# xtask apply_platform_config; dev_ether from config_q35net.toml
# (dev = ["ether"] — the D-01a bound step); dev_ip for the future
# devip profile; dev_exec/dev_bootchain at 14-04/14-05 (the exec
# profiles' keys); dev_churn at 17-02 (q35churn/q35churnshell);
# dev_cap at 18-02 (the q35auth substrate's cap key — main.rs gates
# the devcap tick-hook registration on it)).  CORR-05 / D-02 / D-03
# (Phase 5): the opt-in landed once every unsafe block carried a
# concrete // SAFETY: comment (05-03's 24 + this plan's 8).
[lints]
workspace = true
