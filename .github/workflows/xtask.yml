name: xtask

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run tests
      run: |
        cargo xtask check --verbose
        cargo xtask clippy --verbose

  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Run tests
      run: cargo xtask test --verbose

  build-x86_64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch x86-64 --verbose

  build-aarch64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch aarch64 --verbose

  build-riscv64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch riscv64 --verbose

  # X64-05 (13-06): the q35 boot gates on CI.  Hosted runners lack
  # /dev/kvm, so this leg passes the EXPLICIT TCG overrides — the same
  # --accel/--cpu selection the documented fallback documents, not a
  # downgrade (the no-silent-downgrade rule: accel comes only from the
  # flag > R9_ACCEL > TOML chain; the KVM-native default is exercised
  # on the dev host).  The boot chain is self-provisioned in-job:
  # grub-pc-bin (grub-mkrescue via its grub-common dependency, plus the
  # i386-pc BIOS modules), xorriso, qemu-system-x86.
  boot-test-x86-64:
    runs-on: ubuntu-latest
    # Three sequential TCG boot tests, each legitimately capped by
    # its own 1800 s overall budget (300 s x TCG_OVERALL_MULT 6),
    # plus apt provisioning and three kernel+ISO builds: 120 min
    # bounds the worst legitimate case while keeping a wedged qemu
    # or grub-mkrescue stall far below GitHub's 360-min default.
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v3
    - name: Provision the boot chain (grub-mkrescue, xorriso, qemu)
      run: sudo apt-get update && sudo apt-get install -y grub-pc-bin xorriso qemu-system-x86
    - name: Boot-test the three q35 profiles (explicit TCG — hosted runners are KVM-less)
      run: |
        cargo xtask boot-test --arch x86-64 --config q35 --accel tcg --cpu qemu64 --verbose
        cargo xtask boot-test --arch x86-64 --config q35lowmcfg --accel tcg --cpu qemu64 --verbose
        cargo xtask boot-test --arch x86-64 --config q35net --accel tcg --cpu qemu64 --verbose
