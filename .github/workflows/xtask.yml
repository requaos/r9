name: xtask

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run tests
      run: |
        cargo xtask check --verbose
        cargo xtask clippy --verbose

  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Run tests
      run: cargo xtask test --verbose

  build-x86_64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch x86-64 --verbose

  build-aarch64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch aarch64 --verbose

  # 20-04: the default aarch64 config is raspi3b, which has no dev
  # list, so build-aarch64 never compiles the dev_exec code.  Without
  # this lane no CI job compiled it, which is how the drift that broke
  # the Harvey pin from aa55a27 on went unnoticed.
  build-aarch64-virtshell:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch aarch64 --config virtshell --verbose

  # 20-11: the dev_churn aarch64 code (20-09's churn gate driver) is
  # compiled only by the virtchurn config; neither build-aarch64
  # (raspi3b) nor build-aarch64-virtshell carries it, so without this
  # lane no CI job compiles it.
  build-aarch64-virtchurn:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch aarch64 --config virtchurn --verbose

  # 20-17: the dev_cap aarch64 code (20-15's devcap arm and tick hook,
  # namec's '#¤' registry arm) is compiled only by the virtcpu config,
  # the kernel Harvey's boot-r9-cpu gate boots; without this lane no CI
  # job compiles it.
  build-aarch64-virtcpu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch aarch64 --config virtcpu --verbose

  # 20-17: the aarch64 crate's host tests (the cpu-port battery:
  # shebang_pass, valid_stat_wire, parse_bootconf_pairs,
  # check_cap_extents, at the default and the virtshell cfg) run only
  # on an aarch64 host -- `cargo xtask test` picks the crate leg by the
  # host arch, and every other job here runs on ubuntu-latest (x86_64).
  # ubuntu-24.04-arm is the GitHub-hosted arm64 linux label, available
  # to public repositories on the free plan.  This lane was not
  # observable before it was pushed: if the label is unavailable to
  # this repository, or the crate does not build on linux arm64, the
  # owner decides between fixing and dropping it.
  test-aarch64-host:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v3
    - name: Run tests
      run: cargo xtask test --verbose

  build-riscv64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo xtask build --arch riscv64 --verbose

  # X64-05 (13-06): the q35 boot gates on CI.  Hosted runners lack
  # /dev/kvm, so this leg passes the EXPLICIT TCG overrides — the same
  # --accel/--cpu selection the documented fallback documents, not a
  # downgrade (the no-silent-downgrade rule: accel comes only from the
  # flag > R9_ACCEL > TOML chain; the KVM-native default is exercised
  # on the dev host).  The boot chain is self-provisioned in-job:
  # grub-pc-bin (grub-mkrescue via its grub-common dependency, plus the
  # i386-pc BIOS modules), xorriso, qemu-system-x86.
  boot-test-x86-64:
    runs-on: ubuntu-latest
    # Three sequential TCG boot tests, each legitimately capped by
    # its own 1800 s overall budget (300 s x TCG_OVERALL_MULT 6),
    # plus apt provisioning and three kernel+ISO builds: 120 min
    # bounds the worst legitimate case while keeping a wedged qemu
    # or grub-mkrescue stall far below GitHub's 360-min default.
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v3
    - name: Provision the boot chain (grub-mkrescue, xorriso, qemu)
      run: sudo apt-get update && sudo apt-get install -y grub-pc-bin xorriso mtools qemu-system-x86
    # 19-05: boot-test's ureg-check gate reads
    # $R9_HARVEY_DIR/amd64/include/ureg.h (the cross-repo Ureg-table
    # pin, 14-01 D-02b) BEFORE any boot — without a Harvey checkout
    # every invocation aborts at that precondition, which is why this
    # job had never been green (13-06..19-04: 35 consecutive red runs,
    # each dying ~30s into the step).  The header is 2008-stable in
    # the Harvey tree, so the default-branch checkout satisfies the
    # pin.  mtools is insurance for the hybrid-ISO case: if the runner
    # image carries grub-efi modules, grub-mkrescue builds an ESP via
    # mformat and dies without it.
    - name: Check out the Harvey tree (R9_HARVEY_DIR — the ureg-check gate)
      uses: actions/checkout@v3
      with:
        repository: requaos/harvey
        path: harvey
    - name: Boot-test the three q35 profiles (explicit TCG — hosted runners are KVM-less)
      env:
        R9_HARVEY_DIR: ${{ github.workspace }}/harvey
      run: |
        cargo xtask boot-test --arch x86-64 --config q35 --accel tcg --cpu qemu64 --verbose
        cargo xtask boot-test --arch x86-64 --config q35lowmcfg --accel tcg --cpu qemu64 --verbose
        cargo xtask boot-test --arch x86-64 --config q35net --accel tcg --cpu qemu64 --verbose
