[build]
target = "lib/aarch64-unknown-none-elf.json"
buildflags = ["-Z", "build-std=core,alloc"]

[link]
# linker script to use
script = 'aarch64/lib/kernel.ld'

# kernel load address to insert into kernel.ld (KZERO + 0x40080000; AT()
# emits p_paddr 0x40080000, qemu virt's -kernel load address)
load-address = '0xffff800040080000'

[config]
platform = "virt"
# no dtb key here: virt's DTB is qemu-facing, passed via [qemu].dtb
# The exec profile — main9's exec orchestration replaces the idle
# loop (devroot + /init exec + the TTBR0 teardown + trap_return EL0
# entry); the tick print is cfg-gated off under dev_exec.
dev = ["exec"]

[qemu]
machine = "virt,gic-version=2"
# TCG reference CPU (HVF rejects GICv2 on qemu 11.1.2; HVF would need -cpu
# host, so hvf only becomes viable with a future GICv3 driver)
cpu = "cortex-a72"
smp = 1
memory = "1024M"
accel = "tcg"
# Committed trimmed DTB: qemu loads it at 0x40000000 (the ELF-boot fix —
# without -dtb, qemu 11.1.2 loads no DTB at all for ELF kernels and x0 is 0)
dtb = "aarch64/lib/virt-gicv2.dtb"
# The initrd: qemu's -initrd never delivers
# for ELF kernels (hw/arm/boot.c: ELF => not-linux => the image is never
# loaded and /chosen is never patched), so xtask places the image via qemu's
# generic loader at the fixed PA below and writes /chosen
# linux,initrd-start/end into a patched DTB copy; the kernel validates,
# prints, reserves, and maps the range.  0x48000000 sits
# 128 MiB into the 1 GiB guest, clear of the kernel (0x40080000) and the DTB
# (0x40000000).  The image is the assembled bootfs.paq (staged
# init + hello via `cargo xtask initrd`; workspace-relative target/ path,
# the same emission base as the dtb key) — xtask rebuilds it when missing
# or stale.
initrd = { file = "target/bootfs.paq", addr = 0x48000000 }

[dist]
# ELF is the boot image on virt; skip the objcopy+gzip flat-image pipeline
format = "elf"
