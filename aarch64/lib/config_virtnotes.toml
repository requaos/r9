[build]
target = "lib/aarch64-unknown-none-elf.json"
buildflags = ["-Z", "build-std=core,alloc"]

[link]
# linker script to use
script = 'aarch64/lib/kernel.ld'

# kernel load address to insert into kernel.ld (KZERO + 0x40080000; AT()
# emits p_paddr 0x40080000, qemu virt's -kernel load address)
load-address = '0xffff800040080000'

[config]
platform = "virt"
# no dtb key here: virt's DTB is qemu-facing, passed via [qemu].dtb
# The NOTES profile — byte-identical KERNEL config to virtexec/
# virtmulti (dev = ["exec"] sets the same cfg; the staged init rforks
# three children — hello, smokefork, smokenote — posts the note via
# libc postnote on devproc-lite, and awaits all three under tick
# preemption).  Only the xtask boot-test assertion set differs, and it
# is selected by config NAME (see the selection idiom beside BootTestStep
# in xtask/src/main.rs).
dev = ["exec"]

[qemu]
machine = "virt,gic-version=2"
# TCG reference CPU.  For hvf on darwin pass --accel hvf (or R9_ACCEL=hvf):
# xtask swaps in the gicv3 machine/DTB and -cpu host itself.
cpu = "cortex-a72"
smp = 1
memory = "1024M"
accel = "tcg"
# Committed trimmed DTB: qemu loads it at 0x40000000 (the ELF-boot fix —
# without -dtb, qemu 11.1.2 loads no DTB at all for ELF kernels and x0 is 0)
dtb = "aarch64/lib/virt-gicv2.dtb"
# The initrd (same mechanism as virtexec): the assembled bootfs.paq —
# staged init + hello + smokefork + smokenote via `cargo xtask initrd` —
# placed by qemu's generic loader at the fixed PA below with /chosen
# linux,initrd-start/end patched into a DTB copy.
initrd = { file = "target/bootfs.paq", addr = 0x48000000 }

[dist]
# ELF is the boot image on virt; skip the objcopy+gzip flat-image pipeline
format = "elf"
