[build]
target = "lib/aarch64-unknown-none-elf.json"
buildflags = ["-Z", "build-std=core,alloc"]

[link]
# linker script to use
script = 'aarch64/lib/kernel.ld'

# kernel load address to insert into kernel.ld (KZERO + 0x40080000; AT()
# emits p_paddr 0x40080000, qemu virt's -kernel load address)
load-address = '0xffff800040080000'

[config]
platform = "virt"
# no dtb key here: virt's DTB is qemu-facing, passed via [qemu].dtb
# The NETDRV-03/04 net-gate profile (07-05) — the shell chain (dev_exec +
# dev_bootchain: pid 1 is the real Harvey boot(8) at /boot/boot) plus
# devether's cfg.  cfg(dev_ether) is declared in the workspace check-cfg
# list; the first kernel CODE use lands in 07-06, so until then this
# kernel is behavior-identical to virtshell's.  Unlike config_virtshell,
# the image IS delivered by xtask's [qemu] initrd key (the 07-01 harvey:
# channel), so this profile boots the real chain under cargo xtask
# boot-test with no Harvey-side launcher.
dev = ["exec", "bootchain", "ether"]

[qemu]
machine = "virt,gic-version=2"
# TCG reference CPU.  For hvf on darwin pass --accel hvf (or R9_ACCEL=hvf):
# xtask swaps in the gicv3 machine/DTB and -cpu host itself.
cpu = "cortex-a72"
smp = 1
memory = "1024M"
accel = "tcg"
# Committed trimmed DTB: qemu loads it at 0x40000000 (the ELF-boot fix —
# without -dtb, qemu 11.1.2 loads no DTB at all for ELF kernels and x0 is 0)
dtb = "aarch64/lib/virt-gicv2.dtb"
# The Harvey-baked boot-chain image (07-04's payload: the ARP fixture,
# net-sweep.rc, netblast, dd), resolved through R9_HARVEY_DIR; absence is a
# loud pre-spawn error naming `sh build/aarch64/subset-build.sh` then
# `sh build/aarch64/mkimage.sh`.  0x48000000 is the loader PA the Harvey
# chain uses (run-r9.sh's loader addr), clear of the kernel (0x40080000)
# and the DTB (0x40000000).  The pcap evidence channel rides the 07-01
# netdev stanza (target/boot-test-virtnet.pcap).
initrd = { file = "harvey:build/aarch64/bootfs.paq", addr = 0x48000000 }

[dist]
# ELF is the boot image on virt; skip the objcopy+gzip flat-image pipeline
format = "elf"
