cargo-features = ["per-package-target"]

[package]
name = "aarch64"
version = "0.1.0"
edition = "2024"
default-target = "aarch64-unknown-none"

[dependencies]
aarch64-cpu = "11.2"
bitstruct = "0.1"
port = { path = "../port" }
num_enum = { version = "0.7", default-features = false }

# Opt into the workspace lints (clippy undocumented_unsafe_blocks
# = deny + the check-cfg declarations above).  Only the gated crates
# (aarch64 + port) carry this; x86_64/riscv64 stay opted out (the scope line).
[lints]
workspace = true
