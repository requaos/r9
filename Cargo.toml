[workspace]
resolver = "2"
members = ["aarch64", "x86_64", "port", "riscv64", "xtask", "crypto", "ds"]

# The maximal unsafe-elimination contract: every remaining
# unsafe block/fn/impl/extern in a lint-opted-in crate must carry a SAFETY
# comment — lint-enforced, never the honor system.  The five opted-in crates
# are aarch64, x86_64, port, crypto and ds, each via `[lints] workspace = true`
# in its own Cargo.toml (x86_64 joined at Phase 5's CORR-05, once every
# unsafe block carried a concrete SAFETY comment); riscv64 is never compiled
# by the gates and stays opted out.  (Phase 3 CONTEXT D-11, Phase 5 D-02/D-03.)
#
# The unsafe policy this enforces (CORR-05, owner 2026-11-25, stated
# identically in docs/r9_implementation_guide_for_agentic_developers_v3_0.md
# section 3, docs/plan_r9_architecture_code_compendium_v3_0.md section 2 and
# UNSAFE-AUDIT.md): `crypto/` is crate-wide `forbid(unsafe_code)` over r9's
# own code (not the pinned crates it wraps); `ds/` is per-module forbid with
# exactly two places that may hold unsafe — `ds/src/tpht/` and one reserved
# Roaring SIMD module — and a third needs owner approval; `port/` is
# per-module forbid with the three named floor modules `globalalloc`,
# `mcslock` and `devip_waker`, and no fourth without owner approval;
# `undocumented_unsafe_blocks = deny` applies on `ds/src/tpht/`, `aarch64`
# and `x86_64` (and vacuously on the forbid-held modules of port/crypto/ds).
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# check-cfg declarations for every --cfg xtask can emit (xtask/src/config.rs).
# The dev/ip/link/nodev/nouart families derive cfg names dynamically from TOML
# content (dev_panic, ip_*, link_*, nodev_*, nouart_*); check-cfg has no name
# wildcard, so each family member must be declared here when code first uses
# it.  dev_panic is predeclared for the panic config; dev_exec is
# predeclared for the exec config (dev = ["exec"] in config_virtexec.toml).
# dev_bootchain is predeclared for the shell-chain config
# (dev = ["exec", "bootchain"] in config_virtshell.toml).
# dev_ether is predeclared for the net-gate config (dev = ["exec",
# "bootchain", "ether"] in config_virtnet.toml) — the TOML emission is the
# first appearance; the first code use lands with devether itself (07-06).
# dev_ip is predeclared for the devip config (dev = ["ip"] in the virtip TOML
# lands in plan 08-04) — the predeclare rule demands the declaration BEFORE
# the first code use.
# dev_cap is predeclared for the q35auth substrate config (dev = ["exec",
# "cap"] in x86_64/lib/config_q35auth.toml, 18-02) — the TOML emission and
# port/src/namec.rs's '#¤' registry arm (the first code use) land in the
# SAME commit (the declared rule).
# dev_churn joins for the aarch64 churn gate (dev = ["exec", "ether",
# "churn"] in aarch64/lib/config_virtchurn.toml, 20-09) — the TOML and the
# crate's first code uses (platform/virt/churngate.rs, the exit-tail heap
# marker) land in the SAME commit; x86_64 declares it in its own crate.
# q35 is predeclared for the x86_64 platform config (platform = "q35" in
# x86_64/lib/config_q35.toml, 13-01) — the TOML emission is the first
# appearance; the first kernel code use lands with the platform tree (13-02).
# (Moved from aarch64/Cargo.toml — cargo forbids a crate-level
# [lints.rust] override alongside `[lints] workspace = true`; only the gated
# crates opt in.)
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(platform, values("virt", "raspi3b", "raspi4b", "q35"))',
    'cfg(dev_panic)',
    'cfg(dev_exec)',
    'cfg(dev_bootchain)',
    'cfg(dev_ether)',
    'cfg(dev_ip)',
    'cfg(dev_cap)',
    'cfg(dev_churn)',
] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
