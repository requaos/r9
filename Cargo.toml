[workspace]
resolver = "2"
members = ["aarch64", "x86_64", "port", "riscv64", "xtask"]

# The maximal unsafe-elimination contract: every remaining
# unsafe block/fn/impl/extern in a lint-opted-in crate must carry a SAFETY
# comment — lint-enforced, never the honor system.  Only the gated crates
# (aarch64 + port) opt in via `[lints] workspace = true` in their own
# Cargo.toml; x86_64/riscv64 are never compiled by the gates and stay opted
# out.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# check-cfg declarations for every --cfg xtask can emit (xtask/src/config.rs).
# The dev/ip/link/nodev/nouart families derive cfg names dynamically from TOML
# content (dev_panic, ip_*, link_*, nodev_*, nouart_*); check-cfg has no name
# wildcard, so each family member must be declared here when code first uses
# it.  dev_panic is predeclared for the panic config; dev_exec is
# predeclared for the exec config (dev = ["exec"] in config_virtexec.toml).
# dev_bootchain is predeclared for the shell-chain config
# (dev = ["exec", "bootchain"] in config_virtshell.toml).
# dev_ether is predeclared for the net-gate config (dev = ["exec",
# "bootchain", "ether"] in config_virtnet.toml) — the TOML emission is the
# first appearance; the first code use lands with devether itself (07-06).
# dev_ip is predeclared for the devip config (dev = ["ip"] in the virtip TOML
# lands in plan 08-04) — the predeclare rule demands the declaration BEFORE
# the first code use.
# q35 is predeclared for the x86_64 platform config (platform = "q35" in
# x86_64/lib/config_q35.toml, 13-01) — the TOML emission is the first
# appearance; the first kernel code use lands with the platform tree (13-02).
# (Moved from aarch64/Cargo.toml — cargo forbids a crate-level
# [lints.rust] override alongside `[lints] workspace = true`; only the gated
# crates opt in.)
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(platform, values("virt", "raspi3b", "raspi4b", "q35"))',
    'cfg(dev_panic)',
    'cfg(dev_exec)',
    'cfg(dev_bootchain)',
    'cfg(dev_ether)',
    'cfg(dev_ip)',
] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
