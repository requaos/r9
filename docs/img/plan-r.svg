<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">Plan R</title>
  <desc id="d">A creased TOP SECRET dispatch sheet on a dark cockpit panel, bearing a large boxed letter R and the words "Plan R: authenticated. Proceed with r9."</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.55" stop-color="#e4dfd2"/>
      <stop offset="1" stop-color="#c9c3b4"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.7"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- instrument panel suggestion: rows of dials, abstract -->
  <g fill="none" stroke="#5a5a5a" stroke-width="2" opacity="0.55">
    <circle cx="70" cy="320" r="26"/><circle cx="135" cy="345" r="18"/>
    <circle cx="560" cy="80" r="22"/><circle cx="590" cy="320" r="30"/>
    <circle cx="520" cy="350" r="16"/><circle cx="60" cy="70" r="18"/>
  </g>
  <g stroke="#7a7a7a" stroke-width="2" opacity="0.55">
    <line x1="70" y1="320" x2="84" y2="304"/><line x1="590" y1="320" x2="572" y2="330"/>
    <line x1="560" y1="80" x2="568" y2="64"/>
  </g>

  <g transform="rotate(-4 320 205)" filter="url(#shadow)">
    <rect x="190" y="40" width="260" height="330" rx="3" fill="url(#paper)"/>
    <rect x="190" y="262" width="260" height="8" fill="url(#fold)"/>
    <g filter="url(#ink)" fill="#1c1c1c" font-family="'Courier New', Courier, monospace">
      <text x="320" y="70" text-anchor="middle" font-size="8.5" letter-spacing="0.6">RESTRICTED DISPATCH · KERNEL DIVISION</text>
      <text x="320" y="104" text-anchor="middle" font-size="30" font-weight="700" font-family="Georgia, 'Times New Roman', serif" letter-spacing="2">TOP SECRET</text>
      <rect x="252" y="122" width="136" height="136" fill="none" stroke="#1c1c1c" stroke-width="7"/>
      <rect x="262" y="132" width="116" height="116" fill="none" stroke="#1c1c1c" stroke-width="2"/>
      <text x="320" y="230" text-anchor="middle" font-size="112" font-weight="700" font-family="Georgia, 'Times New Roman', serif">R</text>
      <text x="320" y="286" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1">PLAN R: AUTHENTICATED</text>
      <text x="320" y="306" text-anchor="middle" font-size="11">PROCEED WITH r9</text>
      <g stroke="#1c1c1c" stroke-width="1.2" opacity="0.45">
        <line x1="222" y1="326" x2="418" y2="326"/>
        <line x1="222" y1="338" x2="390" y2="338"/>
        <line x1="222" y1="350" x2="404" y2="350"/>
      </g>
    </g>
    <g transform="rotate(-14 395 335)" opacity="0.78">
      <rect x="352" y="318" width="86" height="30" rx="3" fill="none" stroke="#b3261e" stroke-width="3"/>
      <text x="395" y="339" text-anchor="middle" fill="#b3261e" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="2">9P2000</text>
    </g>
  </g>
</svg>
