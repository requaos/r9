# The arm64 library table (plan 01-17, HARN-03).
#
# One [[library]] per entry of Harvey's pinned arm64 tier-0 allowlist,
# build/aarch64/tiers/tier0-libs.txt at
# bd7a6982a3e4f465f8ed3da5e0c7290521514ff0.  `cargo xtask image --arch
# aarch64 --libraries` checks every listed name against this table and
# the resolved tree: a missing row or a missing arm64/lib/<lib>.a is a
# named failure.
#
# Libraries are an AUDIT table, never image members: in_image stays false,
# and the assembler stages only [[file]]/[[dir]] entries.  `from` is
# tree-relative; `source = "harvey"` records provenance.
#
# liblex's archive is libl.a — the lex runtime's historical name (the
# pinned tier-0 loop's own special case), so its row carries that path.

schema = 1
arch = "arm64"
image = "libraries"

[[library]]
name = "libc"
from = "arm64/lib/libc.a"
source = "harvey"
in_image = false

