# The aarch64 bootfs image manifest (plan 01-17, D-15/D-16/D-29, HARN-03).
#
# One entry per member of the paq Harvey's own aarch64
# build/aarch64/mkimage.sh bakes (bootfs.paq: the boot chain, the real
# init, the v1.0 subset, the net tools, the image probes, the tier-1 h*
# payload and the committed skeleton) at Harvey pin
# bd7a6982a3e4f465f8ed3da5e0c7290521514ff0.  Derived from
# harvey-reference-arm64's bootfs.members (one fresh run of the pinned
# mkimage.sh) by `cargo xtask image --emit-manifest`; every file maps to
# a tree file with the same sha256, including the tier-1 sentinel
# (build/aarch64/tier1-sentinel.txt carries mkimage's own printf bytes).
#
# `cargo xtask image --arch aarch64 --image bootfs --compare-reference`
# must pass before a profile points at it (HARN-06's prohibition).

