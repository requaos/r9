# The x86_64 TIER image (build/x86_64/mkimage.sh §9 at bd7a698): the chain
# tree + the tier-1 sweep payload (the h* renamed copies computed from
# tiers/tier1-cmds.txt) + the sweep script, sentinel and nm fixture under
# /lib/tier1 + the tier termrc override.
#
# Derived from the reference bake's tier.members by `cargo xtask image
# --emit-manifest`; the h* entries are renamed copies of their tree
# sources (one [[file]] each), lib/tier1/sentinel.txt is the tree's
# printf fixture, and every other member is a plain harvey copy.  No
# unresolved marker remains.

schema = 1
arch = "amd64"
image = "tier"

[[file]]
path = "/README.md"
source = "harvey"
from = "build/x86_64/root-tree/README.md"
mode = "0644"

