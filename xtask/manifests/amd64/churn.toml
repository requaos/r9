# The x86_64 CHURN image (build/x86_64/mkimage.sh §12 at bd7a698): the
# chain tree + test/dc + the churncats C driver + the committed
# /lib/churn-cats.rc fixture that rides the skeleton.
#
# Derived from the reference bake's churn.members by `cargo xtask image
# --emit-manifest`; every file maps to the tree file with the same
# sha256, so every entry is source = "harvey".  No unresolved marker
# remains.

schema = 1
arch = "amd64"
image = "churn"

[[file]]
path = "/README.md"
source = "harvey"
from = "build/x86_64/root-tree/README.md"
mode = "0644"

