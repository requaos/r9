# The x86_64 cpu image (build/x86_64/mkimage.sh §15 at bd7a698): the chain
# tree + the §14 auth suite + cmd/cpu + aux/listen + the real cpurc + the
# tcp17010 service file + the §15 font payload + the §15 bake-time p9sk1
# domain + the 19-10 desktop suite.
#
# Derived from the reference bake's cpu.members by `cargo xtask image
# --emit-manifest`, then resolved: every opaque p9sk1 path is an
# `authdomain` generator entry (path, size and mode compared), /lib/ndb/local
# is the `ndb-template` composition from the tree's local.template through
# the netaddr seam, and the whole /lib/font/bit payload is one [[tree]]
# entry (fonts-bit.members, one line per file).  Every other member is a
# plain harvey copy.  No unresolved marker remains.


schema = 1
arch = "amd64"
image = "cpu"

[[file]]
path = "/README.md"
source = "harvey"
from = "build/x86_64/root-tree/README.md"
mode = "0644"

