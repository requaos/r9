# The amd64 SMP-STRESS image: the chain image plus wc(1), for the
# x86_64 smp-stress gate (gates/x86_64/smp-stress.expect).
#
# The gate reads the loopback's eight data files back through a pipe and
# counts the bytes (`cat '#M/dataN' | wc -c`), the aarch64 gate's read
# pass.  It used to redirect them into /tmp and size them with ls -l, but
# the chain image's /tmp is a read-only directory of the boot filesystem
# (`rc: can't open: namec: device has no create`), so the file was never
# written and the stage could not pass.  chain.toml stays the D-29
# reference bake's image; this manifest is that file with one entry added
# (staged from the tree's amd64/bin/wc as net.toml stages it).

schema = 1
arch = "amd64"
image = "smpstress"

[[file]]
path = "/README.md"
source = "harvey"
from = "build/x86_64/root-tree/README.md"
mode = "0644"

[[dir]]
path = "/adm"

[[dir]]
