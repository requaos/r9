# The x86_64 NET image (build/x86_64/mkimage.sh §10 at bd7a698): the chain
# tree + the net payload (the ip container's binaries, the three 6c
# helpers, the utility set) + the /lib fixtures (netaddr.rc and the five
# netip-*.rc sweeps) that ride the committed skeleton.
#
# Derived from the reference bake's net.members by `cargo xtask image
# --emit-manifest`; every file maps to the tree file with the same
# sha256, so every entry is source = "harvey".  No unresolved marker
# remains.  The §10b single-seam discipline is the tree copy of
# netaddr.rc; no venue literal lives outside it.

schema = 1
arch = "amd64"
image = "net"

[[file]]
path = "/README.md"
source = "harvey"
from = "build/x86_64/root-tree/README.md"
mode = "0644"

