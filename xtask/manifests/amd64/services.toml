# The x86_64 SERVICES image (build/x86_64/mkimage.sh §11 at bd7a698): the
# chain tree + the tier-1 h* helpers + the computed tier-2 services set +
# the net/utility members + the §11k host-built hmkdir + the DESK-03
# payload (the whole font tree; /lib/ndb/local composed from the tree's
# local.template through the netaddr seam with the auth row stripped).
#
# Derived from the reference bake's services.members by `cargo xtask image
# --emit-manifest`, then resolved: the 4303 font files are one [[tree]]
# entry (fonts-bit.members), hmkdir and boot/sentinel.txt are tree
# artifacts, /lib/ndb/local is the ndb-template composition (the §11e2
# strip: this image has no auth domain, so the authdom row's whole line is
# removed), and every other member is a plain harvey copy.  No unresolved
# marker remains.

schema = 1
arch = "amd64"
image = "services"

