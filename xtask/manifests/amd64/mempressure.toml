# The amd64 MEM-PRESSURE image: the chain image plus seq(1) and sort(1),
# for the x86_64 mem-pressure gate (gates/x86_64/mem-pressure.expect).
#
# The gate's load is the aarch64 gate's bounded burst, `hseq 1 N | hsort
# > /dev/null`: hsort's line table and sort recursion need more frames
# than the pool has free, so the live evictor runs, and the total stays
# inside what it can reclaim.  The chain image carries neither program,
# and the exec-churn loop the x86_64 gate used instead never exhausted
# the pool at all (measured 2026-11-28: evict_calls=0).  chain.toml stays
# the D-29 reference bake's image; this manifest is that file with two
# entries added (staged from the tree's amd64/bin/seq and amd64/bin/sort
# as tier.toml stages them).

schema = 1
arch = "amd64"
image = "mempressure"

[[file]]
path = "/README.md"
source = "harvey"
from = "build/x86_64/root-tree/README.md"
mode = "0644"

