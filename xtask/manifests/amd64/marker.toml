# The amd64 MARKER image (plan 01-15, D-15/D-16/D-29).
#
# Mirrors Harvey's build/x86_64/mkimage.sh §1-6 (the marker bake: the
# committed skeleton minus the rc+usr subtrees, the empty mount points, the
# smokesleep marker as /amd64/init, and churnmark/churnsem beside it) at
# bd7a6982a3e4f465f8ed3da5e0c7290521514ff0.
#
# Derived by `cargo xtask image --arch x86-64 --image marker
# --emit-manifest` from harvey-reference-amd64's marker.members (the D-29
# reference bake).  The gate is `cargo xtask image --arch x86-64 --image
# marker --compare-reference`: every member must keep its own [[file]]
# entry (D-15), and the member list must equal the reference exactly.
#
# Every file maps to the tree file with the same sha256 (identical relative path
# first, then identical basename, then the lexically first); an unmatched entry fails
# parse_manifest, so a manifest can never silently omit a file.

schema = 1
arch = "amd64"
image = "marker"

[[file]]
path = "/README.md"
source = "harvey"
from = "build/x86_64/root-tree/README.md"
mode = "0644"

[[dir]]
path = "/amd64"

[[file]]
path = "/amd64/churnmark"
source = "harvey"
from = "build/x86_64/smoke-out/churnmark"
mode = "0755"

[[file]]
path = "/amd64/churnsem"
source = "harvey"
from = "build/x86_64/smoke-out/churnsem"
mode = "0755"

[[file]]
path = "/amd64/init"
source = "harvey"
from = "build/x86_64/smoke-out/init"
mode = "0755"

[[file]]
path = "/amd64/smokesleep"
source = "harvey"
from = "build/x86_64/smoke-out/smokesleep"
mode = "0755"

[[dir]]
path = "/bin"

[[dir]]
path = "/bin/service"

[[file]]
path = "/bin/service/tcp17010"
source = "harvey"
from = "build/x86_64/root-tree/bin/service/tcp17010"
mode = "0755"

[[dir]]
