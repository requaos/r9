# The amd64 CHAIN image (plan 01-15, D-15/D-16/D-29).
#
# Mirrors Harvey's build/x86_64/mkimage.sh §8 (the chain bake: boot(8) +
# paqfs, the real init, rc + the core set, the verbatim rcmain and timezone
# copies, and the committed skeleton) at
# bd7a6982a3e4f465f8ed3da5e0c7290521514ff0.
#
# Derived by `cargo xtask image --arch x86-64 --image chain
# --emit-manifest` from harvey-reference-amd64's chain.members (the D-29
# reference bake).  The gate is `cargo xtask image --arch x86-64 --image
# chain --compare-reference`.  /amd64/bin/ps is a per-file entry: it is the
# D-27 swap target every chain-family image stages.
#
# Every file maps to the tree file with the same sha256 (identical relative path
# first, then identical basename, then the lexically first); an unmatched entry fails
# parse_manifest, so a manifest can never silently omit a file.

schema = 1
arch = "amd64"
image = "chain"

[[file]]
path = "/README.md"
source = "harvey"
from = "build/x86_64/root-tree/README.md"
mode = "0644"

