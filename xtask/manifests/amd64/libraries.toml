# The amd64 tier-0 library table (plan 01-14, HARN-03).
#
# One [[library]] per entry of Harvey's pinned tier-0 allowlist,
# build/x86_64/tiers/tier0-libs.txt at
# bd7a6982a3e4f465f8ed3da5e0c7290521514ff0.  `cargo xtask image --arch
# x86-64 --libraries` checks every listed name against this table and the
# resolved tree: a missing row or a missing amd64/lib/<lib>.a is a named
# failure.
#
# Libraries are an AUDIT table, never image members: in_image stays false,
# and the assembler stages only [[file]]/[[tree]] entries.  `from` is
# tree-relative; `source = "harvey"` records provenance (the plan's row
# shape; the manifest schema ignores the redundant field).
#
# liblex is absent from this list: its archive is libl.a, but Harvey's
# pinned tier-0 data names no liblex entry.

schema = 1
arch = "amd64"
image = "libraries"

[[library]]
name = "libc"
from = "amd64/lib/libc.a"
source = "harvey"
in_image = false

